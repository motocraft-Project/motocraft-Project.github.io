<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-labelledby="title"><title id="title">MOTOCRAFT — Spinning tire with white smoke</title><defs><linearGradient id="metal"><stop stop-color="#fff"/><stop offset=".5" stop-color="#8ba3c1"/><stop offset="1" stop-color="#e7f1ff"/></linearGradient></defs><style>.wheel{transform-origin:88px 62px;animation:spin 2s linear infinite}.smoke{animation:drift 3s ease-out infinite}.s2{animation-delay:-1s}.s3{animation-delay:-2s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{0%{opacity:.85;transform:translate(10px,8px) scale(.85)}100%{opacity:0;transform:translate(-15px,-13px) scale(1.25)}}@media(prefers-reduced-motion:reduce){.wheel,.smoke{animation:none}}</style><rect width="520" height="140" rx="16" fill="#101c30"/><g fill="#fff"><circle class="smoke" cx="42" cy="91" r="17"/><circle class="smoke s2" cx="27" cy="70" r="19"/><circle class="smoke s3" cx="23" cy="48" r="14"/></g><g class="wheel"><circle cx="88" cy="62" r="43" fill="#202c3e" stroke="#8395ae" stroke-width="2"/><circle cx="88" cy="62" r="36" fill="none" stroke="#75879e" stroke-width="4" stroke-dasharray="4 7"/><circle cx="88" cy="62" r="26" fill="#142135" stroke="url(#metal)" stroke-width="3"/><g stroke="url(#metal)" stroke-width="7"><path d="M88 38v48M64 62h48M71 45l34 34M71 79l34-34"/></g><circle cx="88" cy="62" r="9" fill="#83adf0"/></g><path d="M60 113h56" stroke="#609bff" stroke-width="3" stroke-linecap="round"/><text x="155" y="69" fill="white" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-style="italic" font-size="34" letter-spacing="1">MOTOCRAFT</text><text x="158" y="93" fill="#92a6c5" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="4">DEALER MANAGEMENT</text></svg>
